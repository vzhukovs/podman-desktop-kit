# Default configuration shipped with the plugin.
#
# Three layers, later overriding earlier per key:
#   1. this file
#   2. $PDKIT_HOME/config.yaml
#   3. <repo>/.pdkit.yaml
#
# In the podman-desktop fork, .pdkit.yaml belongs in .git/info/exclude rather
# than .gitignore: the fork's .gitignore is upstream's file, and editing it puts
# a stray line in every pull request.
#
# Parsed by lib/yaml.js, which supports a deliberate subset: nested maps,
# sequences, scalars, comments. No anchors, no multiline scalars, no tags.

version: 1

repo:
  upstream: podman-desktop/podman-desktop
  fork: vzhukovs/podman-desktop
  upstream_remote: upstream
  fork_remote: origin
  base_branch: main
  package_manager: pnpm

state:
  root: ~/.pdkit/podman-desktop

branches:
  single: "DESKTOP-{issue}/{slug}"
  sliced: "DESKTOP-{issue}/{index}-{slug}"

languages:
  plan: en
  reports: en
  pr_body: en
  commits: en
  review_replies: en
  review_report: en

# There is no `routing:` block here, and its absence is deliberate. Model
# selection lives in the `model:` frontmatter of skills and agents — see
# section 5 of the architecture spec. A skill's own model can only be set
# there, so a second copy in this file would be a lever that moves nothing
# half the time and disagrees with the frontmatter the rest of it.

slicing:
  strategy: prefer-independent   # prefer-independent | stack | single
  max_files_per_slice: 12
  require_standalone_verify: true
  # Every package in the fork has a place in this list. Three of them —
  # packages/api, packages/webview-api and storybook — used to fall through to
  # `other`, which meant their merge order was decided by nothing at all. The
  # order is read twice: lower layers merge first, and layer decides which
  # reviewers a slice will draw.
  # One line: lib/yaml.js parses a deliberate subset and an inline sequence has
  # to close on the line it opened.
  layer_order: [extension-api, api, webview-api, main, preload, renderer, ui, storybook, extensions, tests, website]
  verify:
    # reuse keeps one tree per issue so node_modules survives between runs.
    # ephemeral is correct and slow: every slice pays a full install, and a gate
    # that is expensive to pass is a gate people route around.
    worktree: reuse              # reuse | ephemeral
    install: on-lockfile-change  # on-lockfile-change | always | never
    # Build steps a fresh tree needs before anything can be checked in it, by
    # script name; anything the repository does not define is skipped.
    #
    # podman-desktop needs this one. @podman-desktop/core-api resolves through
    # packages/api/dist, which exists only after build:core-api — and until it
    # does, typecheck:main cannot find the module and eslint's type-aware rules
    # see `any` where a type should be, reporting errors in files no slice
    # touched. Every slice then comes back red for a reason unrelated to
    # slicing. It costs about two seconds.
    prepare: [build:core-api]

# Script name overrides for preflight (section 7). Empty by default: names are
# resolved from the repository's own package.json through a candidate chain,
# which is the right source — podman-desktop has no `pnpm lint`, its `pnpm test`
# drags in e2e, and upstream renames scripts without warning. A hardcoded name
# that no longer exists becomes a check that silently never runs.
#
# Filling this in means the resolver got it wrong, which is a reason to fix the
# resolver rather than to live with an override.
preflight:
  scripts:
    tests: []                  # e.g. [test:main, test:unit]
    lint: []
    typecheck: []
    schemas: []

# How many failed captures of a task's `Done when` make it blocked. The key
# exists because the behaviour does: a ceiling that only lived in configuration
# would be a number nothing reads, which is what open item G refused.
#
# Zero switches blocking off. That direction only — the count itself is not
# configurable, because it comes from captures rather than from a claim.
exec:
  max_attempts: 3

quickfix:
  max_changed_lines: 20
  max_files: 3
  forbid_paths: ["packages/extension-api/**", "**/*.schema.*"]
  allocate_r_ids: false        # tracing goes by issue number
  e2e: off

validation:
  e2e: prefer                  # prefer | required | off
  e2e_stability_runs: 3
  ship_with_feature: true
  require_evidence: true       # PASS without artefacts is refused
  # How the application is brought up under CDP. `binary` is empty on purpose:
  # PODMAN_DESKTOP_BINARY comes next, and after it node_modules/.bin/electron .
  # in the working tree — the development build, which is what upstream's own
  # e2e drives when no packaged binary is set. Packaging costs minutes and
  # proves nothing extra for validation.
  app:
    binary: ""
    debug_port: 9222
    startup_timeout: 60s

tools:
  rtk:
    enabled: auto              # auto | on | off
    readonly_only: true
    never_rewrite:
      [git push, git commit, git reset, git rebase, git cherry-pick, gh pr, gh issue, gh api]
    bypass_for_receipts: true  # evidence is captured with rtk disabled
  ponytail:
    enabled: auto
    mode: full                 # never ultra
    scope: [pd-plan-critic, pd-review-architecture]
    warn_if_global_hooks: true

journal:
  path: journal/
  reanchor_scope: issue        # SessionStart injects the active issue only

review:
  # Logins, not just accounts GitHub marks with a [bot] suffix — several of
  # these post under a plain login. Taken from what actually comments on
  # podman-desktop pull requests: coderabbit reviews, codecov posts a coverage
  # table on every PR.
  bots_collapsed: [coderabbitai, codecov, github-actions, dependabot, renovate]
  # A match EXPANDS a collapsed bot thread back to full text. It never collapses
  # anything and is never consulted for a human: dropping a security finding
  # because it lacked a configured word is the mistake the filter exists to
  # prevent, so the filter does not get to make it.
  bot_escalate: [security, data-loss, correctness]
  stale_after_days: 14         # uncalibrated, like the quickfix thresholds

gates:
  push_ttl: 10m
  # require_states used to live here and was deleted in 0.6 — that is what
  # closed open item B, and it closed by removal rather than by finding the key
  # a job.
  #
  # Which states a token may be issued from now lives in state.GATE_ELIGIBLE,
  # keyed by what is being written: push only from preflight-green, reply from
  # pr-open and review-in-progress. The only thing a config key could really do
  # is WIDEN one of those lists, and a widened push list is a token issued
  # before preflight ran. Every other piece of this plugin holds because the
  # unwanted input does not exist — receipts have no text parameter, the verify
  # verdict has no way in — and a knob that opens the gate wider contradicts
  # exactly that.
  #
  # push_ttl stays: how fast consent goes stale is a real preference, and no
  # value of it lets a write through that was not confirmed.

worktrees:
  enabled: true
  root: ../pd-worktrees
  copy_files: [".env", ".env.local"]

# Expected MCP servers. The plugin ships no .mcp.json and does not start these:
# a plugin-level declaration loads for everyone, which would make them mandatory
# rather than optional. /pd:doctor checks what is present and degrades
# gracefully. Which agents can see a server's tools is set by the `tools:` field
# in agents/*.md, not here.
mcp:
  playwright: auto             # auto | on | off
  context7: off
  basic_memory: off
  github: off
