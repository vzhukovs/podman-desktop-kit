name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # The plugin runs wherever Claude Code does, and the hook handlers spawn
    # processes and touch the filesystem — the two places a platform difference
    # actually shows up. Running one OS would leave that untested, which is the
    # same blind spot `ci-blind-spots` exists to name in somebody else's PR.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install step and no cache key: the plugin is zero-dependency by
      # design, and `npm test` is `node --test` over the suite.
      - name: Test
        run: npm test

  manifest:
    # Separate from the suite because it answers a different question: not "does
    # the code work" but "will this load as a plugin at all". Every test above
    # passes on a manifest Claude Code refuses.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # --strict treats a misspelled or leftover manifest field as an error,
      # which is what we want before anybody installs it. Non-blocking for now:
      # this job has never run on a runner, and a gate whose own reliability is
      # unmeasured should not be the thing that stops a merge. Promote it to
      # blocking once it has been green for a few pull requests.
      - name: Validate the plugin manifest
        continue-on-error: true
        run: claude plugin validate . --strict
